name: "Create User Process"
description: "Verify user creation process"
tags:
  - "smoke"
  - "create_user_process"
steps:
  - "Go to https://t-operator.gdaoperator.aero/"
  - "Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input"
  - "Type '123456' into the password input"
  - "Click the login button"
  - "Click the 'Access Management' button in sidebar"
  - "Click the 'Users' button in sidebar"
  - "Click the 'Create User' button"
  - "Type a random name into the name input"
  - "Type a random surname into the surname input"
  - "Type a random username into username input"
  - "Type a unique email into the email input"
  - "Type a random phone number into the phone number input"
  - "Select 'US English' from the culture dropdown"
  - "Click 'Admin' switch below the Roles title"
  - "Click the 'Save ' button"
  - "Click ellipsis button in the row of the created user by the username"
  - "Click 'Delete' button"
  - "Click 'Delete' button in the confirmation popup"
  - "Verify that the user is deleted from the list"