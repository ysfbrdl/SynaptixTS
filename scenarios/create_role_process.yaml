name: "Create Role Process"
description: "Verify role creation process"
tags:
  - "smoke"
  - "create_role_process"
steps:
  - "Go to https://t-operator.gdaoperator.aero/"
  - "Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input"
  - "Type '123456' into the password input"
  - "Click the login button"
  - "Click the 'Access Management' button in sidebar"
  - "Click the 'Roles' button in sidebar"
  - "Click the 'Create Role' button"
  - "Type a random role into the role name input"
  - "Type 'Test Role Description' into the role description input"
  - "Click 'Access' switch below the Permissions title"
  - "Click 'Account' switch below the Permissions title"
  - "Click 'Save' button"
  - "Verify that the new role is created"
  - "Click ellipsis button in the row of the created role"
  - "Click 'Detail' button"
  - "Verify that 'Action_UserCreate' right exists in the Selection Summary list"
  - "Verify that 'Action_AccountCreate' right exists in the Selection Summary list"
  - "Click 'Cancel' button"
  - "Click ellipsis button in the row of the created role"
  - "Click 'Delete' button"
  - "Click 'Delete' button in the confirmation popup"
  - "Verify that the role is deleted from the list"
