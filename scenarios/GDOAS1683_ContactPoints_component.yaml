name: "Contact Points component Test"
description: "Verify that the contact point component is functioning correctly."
tags:
  - "smoke"
  - "contact_point_component"
steps:
  - "Go to https://t-operator.gdaoperator.aero/"
  - "Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input"
  - "Type '123456' into the password input"
  - "Click the login button"
  - "Click the 'Account Management' button in sidebar"
  - "Click the 'Accounts' button in sidebar"
  - "Click the 'Create Account' button"
  - "Fill the 'Account Name' field with random account name"
  - "Select 'Domestic - Broker' option from 'Contract Program' dropdown"
  - "Click 'Add Contact Point' button"
  - "Verify that 'Contact Point' popup is opened"
  - "Select 'Phone 1' option from 'Contact Type' dropdown"
  - "Type '123456789' to 'Text' field"
  - "Click 'Add' button"
  - "Click 'Add Passenger' button"
  - "Fill the 'First Name' field with random first name"
  - "Fill the 'Last Name' field with random last name"
  - "Click 'Display As' dropdown and select first option"
  - "Select 'Male' from Gender dropdown"
  - "Select 'Phone 1' from 'Phone Type' dropdown"
  - "Type '123456789' to 'Phone Number' field"
  - "Click 'Add' button"
  - "Click 'Save' button"
  - "Click the 'Accounts' button in sidebar"
  - "Type created account name into the search input"
  - "Click the 'Search' button"
  - "Verify that created account exist in the account list based on its 'Account Name'"
  - "Click the newly created account name"
  - "Click edit icon below the 'ACTIONS' column in the 'Contact Points' component"
  - "Verify that 'Contact Point' popup is opened"
  - "Verify that 'Phone 1' option from 'Contact Type' dropdown is selected"
  - "Verify that the 'Text' field value is '123456789' in the 'Contact Point' popup"
  - "Clear the 'Text' field and type '56789'"
  - "Click 'Update' button"
  - "Verify that text value is updated to '56789' below the 'TEXT' column for 'Phone 1' type in the 'Contact Points' component"
  - "Click 'Delete' icon below the 'ACTIONS' column in the 'Contact Points' component"
  - "Verify that 'Delete Contact Point' popup is opened"
  - "Click 'Delete' button"
  - "Verify that 'Phone 1' type is deleted from the 'Contact Points' component"