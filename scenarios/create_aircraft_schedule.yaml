name: "Aircraft Schedule Creation Test"
description: "Verify aircraft schedule creation"
tags:
  - "smoke"
  - "create_aircraft_schedule"
steps:
  - "Go to https://t-operator.gdaoperator.aero/"
  - "Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input"
  - "Type '123456' into the password input"
  - "Click the login button"
  - "Close any visible toast notifications(optional)"
  - "Click the 'Aircraft Management' button in sidebar"
  - "Click the 'Aircraft Schedule List' button in sidebar"
  - "Click the 'Create Aircraft Schedule' button"
  - "Verify that the 'Create Aircraft Schedule' popup is opened"
  - "Select the 'NPC121'  from the aircraft dropdown"
  - "Select 'Charter' from the Duty Type dropdown"
  - "Type 'KSEA' into the airport inputbox and press tab"
  - "Select the 'BRITISH ENGINEERING' from the FBO dropdown"
  - "Click 'Save' button in popup"
  - "Verify that 'Start date/time is required' warning text is appeared"
  - "Click the calendar icon below the Start Date/Time title"
  - "In the date time picker, Click 'Today' button"
  - "Click the calendar icon below the End Date/Time title"
  - "In the date time picker, select the next day"
  - "Click the 'OK' button"
  - "Type 'Test Description' into the Description inputbox"
  - "Click 'Save' button"
  - "Verify that the 'Create Aircraft Schedule' popup is closed"
  - "Click the 'Search' box to enable searching"
  - "Type 'NPC121' into the search box"
  - "Verify that the 'NPC121' A/C TAIL NUMBER exists in the table"