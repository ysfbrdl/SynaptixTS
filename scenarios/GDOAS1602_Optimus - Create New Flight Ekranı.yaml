name: "Create New Flight Ekranı Test"
description: "Verify that the create new flight screen is functioning correctly."
tags:
  - "smoke"
  - "create_new_flight_screen"
steps:
  - "Go to https://t-operator.gdaoperator.aero/"
  - "Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input"
  - "Type '123456' into the password input"
  - "Click the login button"
  - "Click the 'Flight Management' button in sidebar"
  - "Click the 'Flight List' button in sidebar"
  - "Click the 'Create Flight' button"
  - "Select the PC12 from Aircraft Type dropdown"
  - "Select the N158AF from Aircraft dropdown"
  - "Select the Charter from Leg Code dropdown"
  - "Clear the From field"
  - "Type 'KBIL' to From field"
  - "Click Magnifying glass icon in the From field"
  - "Select 'EDWARDS JET CENTER' from the Departure FBO dropdown"
  - "Clear the To field"
  - "Type 'KMEM' to To field"
  - "Click Magnifying glass icon in the To field"
  - "Select 'SIGNATURE FLIGHT SUPPORT' from the Arrival FBO dropdown"
  - "Click calender icon in the Flight Date field"
  - "Click the Today button from the date picker"
  - "Click the 'Save' button"
  - "Click the 'Flight List' button in sidebar"
  - "Scroll to the 'Rows per page' text"
  - "Click the exact text '10' inside .dx-page-sizes container"
  - "Wait for 1000 milliseconds"
  - "Click the exact text '50' inside the options list"
  - "In the grid table, click the highest numeric value in the 'FLIGHT' column"