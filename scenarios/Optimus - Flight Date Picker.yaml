name: Optimus - Flight Date Picker
description: Vreify the Flight Date Picker field functionalities
tags:
  - smoke
  - flight_date_picker
steps:
  - Go to https://t-operator.gdaoperator.aero/
  - Type 'yusuf.birdal@gozendigital.onmicrosoft.com' into the username input
  - Type '123456' into the password input
  - Click the login button
  - Click the 'Flight Management' button in sidebar
  - Click the 'Flight List' button in sidebar
  - Click the 'Create Flight' button
  - Select the PC12 from Aircraft Type dropdown
  - Select the N158AF from Aircraft dropdown
  - Select the Charter from Leg Code dropdown
  - Clear the From field in the Airport & FBO Details component
  - Type 'KBIL' to From field
  - Click the magnifying glass icon in the From field within the Airport & FBO Details component
  - Select 'EDWARDS JET CENTER' from the Departure FBO dropdown
  - Clear the To field in the Airport & FBO Details component
  - Type 'KMEM' to To field
  - Press Tab button
  - Select 'SIGNATURE FLIGHT SUPPORT' from the Arrival FBO dropdown
  - Verify that the 'Duration' field is displayed next to the To date field
  - Hold the Duration value
  - Click calender icon in the From Date field
  - "Click the first button located to the right of the \":\" text "
  - Click OK button
  - Verify that Duration value is not changed
  - Click calender icon in the To Date field
  - "Click the first button located to the right of the \":\" text "
  - Click OK button
  - Verify that Duration value is not changed
  - Click the Link button between the From and To date fields
  - Click calender icon in the From Date field
  - "Click the first button located to the right of the \":\" text "
  - Click OK button
  - Verify that Duration value is different from holded Duration value
